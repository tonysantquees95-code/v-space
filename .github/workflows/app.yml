name: App (interface e APK)

# Verifica a interface e gera o APK do Android (Capacitor + plugin Java). Cada versão boa vira uma release "1.N" com V-Space.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
      - name: Teste visual (telas em vários tamanhos)
        run: npm run test:visual
        working-directory: app
        env:
          CHROME: C:/Program Files/Google/Chrome/Application/chrome.exe
      - name: Guardar as fotos das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-das-telas
          path: app/teste-visual/fotos/
          retention-days: 7

  android:
    needs: verificar
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Preparar o projeto Android
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}
        run: |
          npm run build
          npx cap add android
          # a versão do app passa a ser a do build (1.<número>)
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionName\|versionCode" android/app/build.gradle
          D=android/app/src/main/java/tech/vetorial/vspace
          mkdir -p $D
          cp ../nativo/src/*.java $D/
          python3 - <<'PY'
          import re
          m = "android/app/src/main/AndroidManifest.xml"
          t = open(m, encoding="utf-8").read()
          # permissões: ver todos os apps instalados (o launcher precisa) e desinstalar pelo menu
          perms = '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
          t = t.replace("<application", perms + "    <application", 1)
          # a tela do V-Space vira "tela inicial" do Android: categorias HOME e DEFAULT, uma única instância, sem aparecer nos recentes duplicada
          home = '<intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />\n            </intent-filter>\n        '
          t = t.replace("</activity>", "    " + home + "</activity>", 1)
          t = re.sub(r'android:launchMode="[^"]*"', 'android:launchMode="singleTask"', t, count=1)
          if 'android:launchMode' not in t:
              t = t.replace("<activity", '<activity android:launchMode="singleTask" android:stateNotNeeded="true"', 1)
          # serviço vazio que dá acesso à sessão de mídia (música tocando) quando a pessoa libera as notificações
          servico = '    <service android:name=".MusicaListener" android:label="V-Space" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService" />\n            </intent-filter>\n        </service>\n    '
          t = t.replace("</application>", servico + "</application>", 1)
          open(m, "w", encoding="utf-8").write(t)
          PY
          grep -n "HOME\|launchMode\|QUERY_ALL" android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#05070D' --iconBackgroundColorDark '#05070D' --splashBackgroundColor '#05070D' --splashBackgroundColorDark '#05070D'
          npx cap sync android
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: v-space-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v-space-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/V-Space.apk
          gh release create "1.${{ github.run_number }}" pacote/V-Space.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "V-Space 1.${{ github.run_number }}" --notes "V-Space.apk (Android)."
